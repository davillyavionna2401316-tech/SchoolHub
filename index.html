                        recognition.continuous = true;
                        recognition.interimResults = true;
                        recognition.lang = 'id-ID';

                        recognition.onresult = (event) => {
                            let transcript = '';
                            for (let i = event.resultIndex; i < event.results.length; i++) {
                                transcript += event.results[i][0].transcript;
                            }
                            setNotulenForm((prev) => ({
                                ...prev,
                                hasil_pembahasan: prev.hasil_pembahasan + ' ' + transcript,
                                transkrip_audio: (prev.transkrip_audio || '') + '\n' + transcript
                            }));
                        };

                        recognition.onerror = () => setIsRecording(false);
                        recognition.start();
                        recognitionRef.current = recognition;
                    } else {
                        const sampleVoiceText = "\n[Transkrip Otomatis Voice]: Rapat menyetujui pengadaan perangkat pendukung lab komputer.";

                    mounted = false;

            const [trackInput, setTrackInput] = useState({ ticketNo: '', accessCode: '' });
            const [trackedResult, setTrackedResult] = useState(null);
            const [trackError, setTrackError] = useState('');

                setTrackedResult(null);

                    (a) => a.nomor_tiket.toLowerCase() === trackInput.ticketNo.trim().toLowerCase()

                if (!found) {
                    setTrackError('Nomor Tiket tidak ditemukan dalam database.');
                    return;
                }

                if (found.kode_akses_publik && found.kode_akses_publik !== trackInput.accessCode.trim()) {
                    setTrackError('Kode Akses Publik / Verifikasi tidak cocok!');
                    return;

                const histories = riwayatList.filter((r) => r.aspirasi_id === found.id && r.tampilkan_ke_publik);
                setTrackedResult({ item: found, histories });

            // --- DASHBOARD ACTION FORM STATES ---
            const [followUpForm, setFollowUpForm] = useState({
                petugas_pj: '',
                prioritas: 'Sedang',
                target_selesai: '',
                jenis_tindakan: 'Pemeriksaan laporan',
                uraian_tindakan: '',
                hasil_sementara: '',
                kendala: '',
                rencana_berikutnya: '',
                new_status: 'Dalam Proses Tindak Lanjut',

                ringkasan_hasil: '',
                tindakan_akhir: '',
                catatan_penyelesaian: '',
                alasan_penolakan: ''
            });

            const openFollowUpModal = (item) => {
                setSelectedTicketDetail(item);
                setFollowUpForm({
                    petugas_pj: item.petugas_pj || userProfile.name,
                    prioritas: item.prioritas || 'Sedang',
                    target_selesai: item.tanggal_target_selesai || '',
                    jenis_tindakan: 'Pemeriksaan laporan',
                    uraian_tindakan: '',
                    hasil_sementara: '',
                    kendala: '',
                    rencana_berikutnya: '',
                    new_status: item.status || 'Dalam Proses Tindak Lanjut',
                    tampilkan_ke_publik: true,
                    ringkasan_hasil: item.ringkasan_hasil || '',
                    tindakan_akhir: item.tindakan_akhir || '',
                    catatan_penyelesaian: item.catatan_penyelesaian || '',
                    alasan_penolakan: item.alasan_penolakan || ''

                setIsFollowUpModalOpen(true);
            };

            const handleSaveFollowUp = async (e) => {
                e.preventDefault();
                if (!selectedTicketDetail) return;

                if (followUpForm.new_status === 'Selesai') {
                    if (!followUpForm.ringkasan_hasil || !followUpForm.tindakan_akhir || !followUpForm.catatan_penyelesaian) {
                        showToast('Untuk status SELESAI, wajib mengisi Ringkasan Hasil, Tindakan Akhir, dan Catatan Penyelesaian!', 'error');
                        return;
                    }
                }

                if (followUpForm.new_status === 'Tidak Dapat Ditindaklanjuti' && !followUpForm.alasan_penolakan) {
                    showToast('Untuk status TIDAK DAPAT DITINDAKLANJUTI, wajib mengisi Alasan Penolakan!', 'error');
                    return;
                }

                const nowISO = new Date().toISOString();
                const updatedFields = {
                    petugas_pj: followUpForm.petugas_pj,
                    prioritas: followUpForm.prioritas,
                    status: followUpForm.new_status,
                    tanggal_target_selesai: followUpForm.target_selesai || null,
                    tanggal_penyelesaian: followUpForm.new_status === 'Selesai'
                        ? nowISO.slice(0, 10)
                        : (selectedTicketDetail.tanggal_penyelesaian || null),
                    ringkasan_hasil: followUpForm.ringkasan_hasil || null,
                    tindakan_akhir: followUpForm.tindakan_akhir || null,
                    catatan_penyelesaian: followUpForm.catatan_penyelesaian || null,
                    alasan_penolakan: followUpForm.alasan_penolakan || null,
                    updated_at: nowISO
                };

                const { error: updateError } = await supabaseClient
                    .from('aspirasi_laporan')
                    .update(updatedFields)
                    .eq('id', selectedTicketDetail.id);

                if (updateError) {
                    console.error('Gagal memperbarui laporan:', updateError);
                    showToast('Perubahan laporan gagal disimpan: ' + updateError.message, 'error');
                    return;
                }

                const historyPayload = {
                    aspirasi_id: selectedTicketDetail.id,
                    tanggal: nowISO,
                    petugas: userProfile.name || 'Admin',
                    jenis_tindakan: followUpForm.jenis_tindakan,
                    uraian: followUpForm.uraian_tindakan || `Pembaruan status menjadi ${followUpForm.new_status}`,
                    hasil_sementara: followUpForm.hasil_sementara || null,
                    kendala: followUpForm.kendala || null,
                    rencana_berikutnya: followUpForm.rencana_berikutnya || null,
                    status_pada_saat_ini: followUpForm.new_status,
                    tampilkan_ke_publik: followUpForm.tampilkan_ke_publik
                };

                const { error: historyError } = await supabaseClient
                    .from('aspirasi_riwayat')
                    .insert(historyPayload);

                const updatedAspirasi = aspirasiList.map((item) =>
                    item.id === selectedTicketDetail.id ? { ...item, ...updatedFields } : item

                setAspirasiList(updatedAspirasi);
                setSelectedTicketDetail((prev) => prev ? { ...prev, ...updatedFields } : prev);

                                                    <div key={i} className="flex items-center justify-between p-2 bg-slate-100 rounded-lg text-xs">
                                                        <span className="truncate font-mono">{f.name} ({f.size})</span>
                                                        <button type="button" onClick={() => removeUploadedFile(i)} className="text-rose-600 hover:underline font-bold">Hapus</button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
                                        <button
                                            type="button"
                                            onClick={() => setIsDokumentasiModalOpen(false)}
                                            className="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-bold"
                                        >
                                            Batal
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-cyan-400 rounded-xl font-bold shadow"
                                        >
                                            Simpan Dokumentasi
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
